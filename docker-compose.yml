services:
  backuppc:
    image: backuppc:4.4.0
    restart: unless-stopped

    environment:
      WEBUI_USER:       ${WEBUI_USER:-backuppc}
      WEBUI_PASSWORD:   ${WEBUI_PASSWORD:-}
      ROOTLESS_RUNTIME: ${ROOTLESS_RUNTIME:-false}
      TZ: ${TZ:-Europe/Paris}

    ports:
      - "${HTTP_PORT:-80}:80"

    volumes:
      - ${BACKUPPC_CONFIG_VOL}:/etc/backuppc
      - ${BACKUPPC_DATA_VOL}:/var/lib/backuppc
      - ${BACKUPPC_LOGS_VOL}:/var/log/backuppc

    # 200 = OK, 401 = normal (authentication required)
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w \"%{http_code}\" http://localhost/backuppc | grep -qE \"^(200|401)$\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  backuppc-data:
  backuppc-config:
  backuppc-logs:
